# Deploy static site to Cloudflare Pages
#
# Deploys happen automatically via the Cloudflare Pages Git integration (the
# project blank2branded-sa is connected to this repo's main branch — its
# "Cloudflare Pages" check-run posts "Deployed successfully" on every commit).
#
# This workflow does NOT run `wrangler pages deploy`: Cloudflare refuses
# direct-upload deploys to a Git-integrated project (wrangler exits 1, which
# painted every run red even though the site deployed fine). Here we build as
# a CI gate; the asset upload itself is Cloudflare's job.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # These two are public-by-design client values (the publishable key ships in
  # the JS bundle to every visitor). They used to come from a committed .env;
  # .env is now untracked because it holds a secret, so we set them here.
  VITE_SUPABASE_URL: https://nrdhekbxptagzqasixra.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_2B6o5QhrpPZODEfJdc9Syg_Z3Zb3ahe

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: bun run build

      - name: Sanity-check build output
        run: |
          test -f dist/index.html
          test -f dist/og-default.png
          test -f dist/sitemap.xml
          test -f dist/blog/index.html
          test -f dist/_routes.json
          build_pages=$(find dist/blog -name index.html | wc -l)
          echo "blog pages prerendered: $build_pages"
          test "$build_pages" -gt 1
